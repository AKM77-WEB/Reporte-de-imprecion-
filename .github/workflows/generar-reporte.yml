name: Generar reporte

on:
  push:
    branches: [main]
    paths:
      - 'incoming/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-reporte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar reporte desde los CSV de incoming/
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Csv([string]$prefix) {
            $f = Get-ChildItem -Path incoming -Filter *.csv -File |
                 Where-Object { $_.Name -match ('(?i)^' + $prefix) } |
                 Select-Object -First 1
            if (-not $f) { throw "No se encontro un CSV que empiece con '$prefix' en la carpeta incoming/. Sube los 4 archivos: ALMACEN.csv, ADMINISTRACION.csv, POSTVENTA.csv, OPERACIONES.csv" }
            return $f.FullName
          }

          # ---- CSV combinado: un solo export con todas las impresoras ----
          # Cada fila trae la IP y el host del equipo, asi que se puede separar
          # por area aqui mismo. Si conviven el combinado y los CSV por area,
          # gana el que se haya subido (commiteado) mas recientemente.
          $areaNames = 'ALMACEN','ADMINISTRACION','POSTVENTA','OPERACIONES'
          function Test-EsArea([string]$n) {
            foreach ($a in $areaNames) { if ($n -match ('(?i)^' + $a)) { return $true } }
            return $false
          }
          function Get-CommitTime([string]$path) {
            $raw = git log -1 --format=%ct -- $path
            if ($raw) { return [long]$raw } else { return 0 }
          }

          $combinado = Get-ChildItem incoming -Filter *.csv -File |
                       Where-Object { -not (Test-EsArea $_.Name) } | Select-Object -First 1
          $usarCombinado = $false
          if ($combinado) {
            $tComb = Get-CommitTime "incoming/$($combinado.Name)"
            $tAreas = 0
            foreach ($f in (Get-ChildItem incoming -Filter *.csv -File | Where-Object { Test-EsArea $_.Name })) {
              $t = Get-CommitTime "incoming/$($f.Name)"
              if ($t -gt $tAreas) { $tAreas = $t }
            }
            if ($tComb -ge $tAreas) { $usarCombinado = $true }
            else { Write-Host "CSV combinado presente pero mas viejo que los CSV por area: se usan los CSV por area." }
          }

          if ($usarCombinado) {
            Write-Host "CSV combinado: $($combinado.Name); separando por impresora..."
            $mapaIP   = @{ '120.200.120.29' = 'ALMACEN'; '120.200.127.77' = 'ADMINISTRACION';
                           '120.200.120.31' = 'POSTVENTA'; '120.200.124.6' = 'OPERACIONES' }
            $mapaHost = @{ 'KM1AEFDE' = 'ALMACEN'; 'KM0F008F' = 'ADMINISTRACION';
                           'KM1AEFDD' = 'POSTVENTA'; 'KM1AEFDA' = 'OPERACIONES' }
            $lineas = Get-Content $combinado.FullName -Encoding UTF8
            $porArea = @{}
            foreach ($a in $areaNames) { $porArea[$a] = New-Object System.Collections.Generic.List[string] }
            foreach ($l in ($lineas | Select-Object -Skip 1)) {
              $area = $null
              if ($l -match '"(\d{1,3}(?:\.\d{1,3}){3})"' -and $mapaIP.ContainsKey($Matches[1])) { $area = $mapaIP[$Matches[1]] }
              elseif ($l -match '"(KM[0-9A-Fa-f]{6})"' -and $mapaHost.ContainsKey($Matches[1].ToUpper())) { $area = $mapaHost[$Matches[1].ToUpper()] }
              if ($area) { $porArea[$area].Add($l) }
            }
            $splitDir = Join-Path (Get-Location).Path '_split'
            New-Item -ItemType Directory -Path $splitDir -Force | Out-Null
            $Utf8Sep = New-Object System.Text.UTF8Encoding($false)
            foreach ($a in $areaNames) {
              if ($porArea[$a].Count -eq 0) {
                throw "El CSV combinado no trae ninguna fila de $a. ¿Cambio la IP de esa impresora? (se esperan: 120.200.120.29 ALMACEN, 120.200.127.77 ADMINISTRACION, 120.200.120.31 POSTVENTA, 120.200.124.6 OPERACIONES)"
              }
              [System.IO.File]::WriteAllLines((Join-Path $splitDir "$a.csv"), ([string[]](@($lineas[0]) + $porArea[$a])), $Utf8Sep)
              Write-Host "  $a.csv: $($porArea[$a].Count) filas"
            }
            $almacen     = Join-Path $splitDir 'ALMACEN.csv'
            $admin       = Join-Path $splitDir 'ADMINISTRACION.csv'
            $postventa   = Join-Path $splitDir 'POSTVENTA.csv'
            $operaciones = Join-Path $splitDir 'OPERACIONES.csv'
          } else {
            $almacen     = Find-Csv 'ALMACEN'
            $admin       = Find-Csv 'ADMINISTRACION'
            $postventa   = Find-Csv 'POSTVENTA'
            $operaciones = Find-Csv 'OPERACIONES'
          }

          # Fecha y periodo en horario de Ciudad de Mexico
          $tz  = [TimeZoneInfo]::FindSystemTimeZoneById('America/Mexico_City')
          $now = [TimeZoneInfo]::ConvertTimeFromUtc([datetime]::UtcNow, $tz)
          $generado = $now.ToString('dd/MM/yyyy')

          $periodoFile = 'incoming/periodo.txt'
          if (Test-Path $periodoFile) {
            $periodo = (Get-Content $periodoFile -Raw -Encoding UTF8).Trim()
          }
          if (-not $periodo) {
            $cult = [cultureinfo]::GetCultureInfo('es-MX')
            $mes  = $cult.DateTimeFormat.GetMonthName($now.Month)
            $periodo = $mes.Substring(0,1).ToUpper() + $mes.Substring(1) + ' ' + $now.Year
          }

          $params = @{
            AlmacenCsv     = $almacen
            AdminCsv       = $admin
            PostventaCsv   = $postventa
            OperacionesCsv = $operaciones
            Periodo        = $periodo
            Generado       = $generado
          }
          if (Test-Path 'incoming/epson.json') { $params.EpsonJson = 'incoming/epson.json' }

          # ---- Linea base: los contadores ya no necesitan reiniciarse en cada corte ----
          # baseline/current = CSVs del corte anterior; baseline/prev = del corte antepasado.
          # Corte nuevo (CSVs distintos a baseline/current): se resta baseline/current.
          # Re-corrida con los mismos CSVs (p.ej. para cambiar el periodo): se resta
          # baseline/prev, para que el reporte salga con los mismos numeros.
          $curDir  = 'baseline/current'
          $prevDir = 'baseline/prev'
          $canon = [ordered]@{ ALMACEN=$almacen; ADMINISTRACION=$admin; POSTVENTA=$postventa; OPERACIONES=$operaciones }

          # Hash del contenido normalizando fines de linea (CRLF vs LF no debe
          # contar como archivo distinto: Windows y Linux los guardan diferente)
          function Get-ContentHash([string]$path) {
            $t = [System.IO.File]::ReadAllText($path) -replace "`r`n", "`n"
            $sha = [System.Security.Cryptography.SHA256]::Create()
            return [System.BitConverter]::ToString($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($t)))
          }

          $esCorteNuevo = $true
          if (Test-Path $curDir) {
            $esCorteNuevo = $false
            foreach ($p in $canon.Keys) {
              $cur = Get-ChildItem $curDir -Filter *.csv -File |
                     Where-Object { $_.Name -match ('(?i)^' + $p) } | Select-Object -First 1
              if (-not $cur -or ((Get-ContentHash $canon[$p]) -ne (Get-ContentHash $cur.FullName))) {
                $esCorteNuevo = $true; break
              }
            }
          }

          # Sin CSVs nuevos y sin linea base previa no hay nada que regenerar
          # (p.ej. solo se edito periodo.txt): se conserva el reporte publicado.
          if (-not $esCorteNuevo -and -not (Test-Path $prevDir)) {
            # Aun asi, un primer registro de lecturas Epson si establece su base.
            if ((Test-Path 'incoming/epson.json') -and -not (Test-Path (Join-Path $curDir 'epson.json'))) {
              Copy-Item 'incoming/epson.json' (Join-Path $curDir 'epson.json')
              Write-Host "Primer registro Epson: lecturas guardadas como linea base para el siguiente corte."
            }
            Write-Host "Los CSV de incoming/ ya fueron procesados y no existe baseline/prev: no se regenera nada."
            exit 0
          }

          $baseDir = if ($esCorteNuevo) { $curDir } else { $prevDir }
          if (Test-Path $baseDir) { $params.BaselineDir = $baseDir }
          $epsonBase = Join-Path $baseDir 'epson.json'
          if (Test-Path $epsonBase) { $params.EpsonBaselineJson = $epsonBase }
          Write-Host "Corte nuevo: $esCorteNuevo | Linea base: $(if (Test-Path $baseDir) { $baseDir } else { 'ninguna (contadores tal cual)' })"

          ./Build-Report.ps1 @params

          # Rotar la linea base solo cuando hubo corte nuevo
          if ($esCorteNuevo) {
            if (Test-Path $prevDir) { Remove-Item $prevDir -Recurse -Force }
            if (Test-Path $curDir)  { Move-Item $curDir $prevDir }
            New-Item -ItemType Directory -Path $curDir -Force | Out-Null
            foreach ($p in $canon.Keys) { Copy-Item $canon[$p] (Join-Path $curDir "$p.csv") }
            # La base Epson viaja con el corte: lecturas nuevas si las hay,
            # si no se arrastra la base anterior (el diff cubrira dos periodos).
            if (Test-Path 'incoming/epson.json') { Copy-Item 'incoming/epson.json' (Join-Path $curDir 'epson.json') }
            elseif (Test-Path (Join-Path $prevDir 'epson.json')) { Copy-Item (Join-Path $prevDir 'epson.json') (Join-Path $curDir 'epson.json') }
          } else {
            # Re-corrida: si las lecturas Epson llegaron despues del corte,
            # quedan como base del siguiente (por eso las lecturas se actualizan
            # JUNTO con los CSV o despues de subirlos, nunca dias antes).
            if (Test-Path 'incoming/epson.json') {
              Copy-Item 'incoming/epson.json' (Join-Path $curDir 'epson.json') -Force
            }
          }

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reports/ baseline/
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Reporte actualizado automaticamente desde incoming/"
            git push
          fi
